apiVersion: v1
kind: Secret
metadata:
  name: netrcsecret
type: Opaque
## This is a dummy .netrc file for public/demo usage.
## Replace these values with real Git credentials only in a private environment.
## For public GitHub repositories, this Secret is not required, but it is kept
## here so the Kubernetes manifest can be applied without changing the StatefulSet.
stringData:
  .netrc: |
    machine example.com
    login dummy-user
    password dummy-password