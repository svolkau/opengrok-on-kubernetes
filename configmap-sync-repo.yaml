apiVersion: v1
kind: ConfigMap
metadata:
  name: repo-to-sync
data:
  repoToSync.sh: |
    #!/bin/bash
    set -e

    apt update
    apt install git vim tree -y

    sync_repo() {
      local target_dir="$1"
      local repo_url="$2"

      if [ -d "$target_dir/.git" ]; then
        echo "Repository already exists: $target_dir"
        echo "Pulling latest changes..."
        git -C "$target_dir" pull --ff-only
      else
        echo "Cloning repository: $repo_url"
        git clone "$repo_url" "$target_dir"
      fi
    }

    mkdir -p /opengrok/src/proj1
    mkdir -p /opengrok/src/proj2

    sync_repo "/opengrok/src/proj1/example-voting-app" "https://github.com/dockersamples/example-voting-app.git"
    sync_repo "/opengrok/src/proj2/compose-dev-env" "https://github.com/dockersamples/compose-dev-env.git"

    echo "Repo sync completed."
    