apiVersion: v1
kind: Secret
metadata:
  name: regcred
type: kubernetes.io/dockerconfigjson
# Dummy image pull secret for public/demo usage.
# Replace these placeholders with real registry credentials only if you use
# private container images. The demo uses public images, so this Secret is only
# kept to satisfy the imagePullSecrets reference in the StatefulSet.
stringData:
  .dockerconfigjson: |
    {
      "auths": {
        "example.com": {
          "username": "dummy-user",
          "password": "dummy-password",
          "email": "dummy@example.com",
          "auth": "ZHVtbXktdXNlcjpkdW1teS1wYXNzd29yZA=="
        }
      }
    }